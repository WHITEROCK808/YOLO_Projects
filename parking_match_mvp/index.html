<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parking Match MVP</title>
<style>
body{font-family:system-ui,"Noto Sans CJK TC",sans-serif;background:#f4f6f8;color:#18212b;margin:0}main{max-width:1100px;margin:32px auto;padding:0 18px}h1{margin-bottom:4px}.sub{color:#697586}.panel{background:white;border-radius:14px;padding:18px;margin-top:18px;box-shadow:0 2px 12px #172b3d12}input,button{padding:10px;border:1px solid #d5dce3;border-radius:8px;font-size:16px}button{background:#155eef;color:white;border:0;cursor:pointer}.form{display:flex;gap:10px;flex-wrap:wrap}.form input{width:150px}.cards{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.card{padding:12px 15px;border-radius:10px;min-width:150px;background:#eef2f6}.known{background:#dcfce7}.visitor{background:#fef3c7}.unknown{background:#fee2e2}.muted{color:#697586;font-size:13px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e7ebef}th{color:#697586;font-size:13px}.pill{padding:4px 8px;border-radius:99px;font-size:13px}.pill.guest{background:#dcfce7}.pill.staff{background:#dbeafe}.pill.visitor{background:#fef3c7}.pill.unknown{background:#fee2e2}.warning{color:#9a3412;font-size:13px;margin-top:12px}
</style>
<main><h1>停車入口辨識</h1><div class="sub">Parking Match MVP｜車牌 → 登記資料 → 人工覆核提示</div>
<section class="panel"><h2>模擬一筆辨識結果</h2><div class="form"><input id="plate" value="ABC-1234" placeholder="車牌，例如 ABC-1234"><input id="confidence" value="0.96" type="number" min="0" max="1" step="0.01"><input id="camera" value="入口車道"><button onclick="recognize()">送出辨識</button></div><div id="result"></div><div class="warning">車牌吻合不等於已確認車內本人；目前只做提示與紀錄，不控制柵欄。</div></section>
<section class="panel"><h2>最近辨識</h2><div class="cards" id="stats"></div><table><thead><tr><th>時間</th><th>車牌</th><th>判定</th><th>對應資料</th><th>信心</th></tr></thead><tbody id="events"></tbody></table></section></main>
<script>
const labels={guest:'住客',staff:'員工',visitor:'訪客',unknown:'陌生／未登記'};
async function refresh(){const rows=await fetch('/api/recognitions').then(r=>r.json());const counts={guest:0,visitor:0,staff:0,unknown:0};rows.forEach(x=>counts[x.match_status]=(counts[x.match_status]||0)+1);document.querySelector('#stats').innerHTML=Object.entries(counts).map(([k,v])=>`<div class="card ${k}"><b>${labels[k]}</b><br><strong>${v}</strong> 筆</div>`).join('');document.querySelector('#events').innerHTML=rows.map(x=>`<tr><td>${x.recognized_at}</td><td><b>${x.plate}</b></td><td><span class="pill ${x.match_status}">${labels[x.match_status]}</span></td><td>${x.guest_name||'—'} ${x.reservation_ref?`<span class="muted">(${x.reservation_ref})</span>`:''}</td><td>${x.confidence==null?'—':Number(x.confidence).toFixed(2)}</td></tr>`).join('')}
async function recognize(){const payload={plate:document.querySelector('#plate').value,confidence:Number(document.querySelector('#confidence').value),camera:document.querySelector('#camera').value};const r=await fetch('/api/recognitions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const x=await r.json();document.querySelector('#result').innerHTML=`<p class="card ${x.match_status}"><b>${labels[x.match_status]}</b>：${x.plate} → ${x.guest_name||'沒有登記資料'}</p>`;refresh()}refresh();setInterval(refresh,5000);
</script>
